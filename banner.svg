<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <style>
      .m { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(340px); } }
      .b { animation: blink 1.2s steps(1) infinite; }
      .p { animation: pulse 4s ease-in-out infinite; }
      .scan { animation: scan 8s linear infinite; }
    </style>

    <filter id="blueGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>

    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>

    <clipPath id="frame">
      <rect x="12" y="12" width="976" height="296" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="12" y="12" width="976" height="296" fill="url(#bg)"/>
    <rect x="12" y="12" width="976" height="296" fill="url(#grid)" opacity="0.55"/>

    <rect class="scan" x="12" y="0" width="976" height="45" fill="url(#scanline)"/>

    <text class="m" x="500" y="46" font-size="11" text-anchor="middle" fill="#64748b" letter-spacing="4">// DEFENSIVE SECURITY &amp; THREAT MONITORING</text>

    <g transform="translate(38,36)">
      <circle class="p" cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text class="m" x="18" y="10" font-size="11" fill="#94a3b8" letter-spacing="2">BLUE TEAM :: ACTIVE</text>
    </g>

    <!-- ERICK A. -->
    <g fill="none" stroke="#f8fafc" stroke-width="8.5" stroke-linejoin="miter" stroke-linecap="butt">
      <path d="M38,0H4V60H38 M4,30H30" transform="translate(182,78) scale(1.75)"/>
      <path d="M4,60V0H28L36,8V22L28,30H4 M24,30L38,60" transform="translate(268,78) scale(1.75)"/>
      <path d="M8,0H32 M20,0V60 M8,60H32" transform="translate(354,78) scale(1.75)"/>
      <path d="M38,8L30,0H10L2,8V52L10,60H30L38,52" transform="translate(440,78) scale(1.75)"/>
      <path d="M4,0V60 M38,0L6,32 M14,24L38,60" transform="translate(526,78) scale(1.75)"/>
      <path d="M4,60L16,0H24L36,60 M9,38H31" transform="translate(658,78) scale(1.75)"/>
      <path d="M16,52H24V60H16Z" transform="translate(734,78) scale(1.75)"/>
    </g>

    <!-- SECOPS -->
    <g filter="url(#blueGlow)" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="miter" stroke-linecap="butt">
      <path d="M36,8L30,0H10L2,8V22L10,30H30L38,38V52L30,60H10L2,52" transform="translate(330,208) scale(0.95)"/>
      <path d="M38,0H4V60H38 M4,30H30" transform="translate(378,208) scale(0.95)"/>
      <path d="M38,8L30,0H10L2,8V52L10,60H30L38,52" transform="translate(426,208) scale(0.95)"/>
      <path d="M10,0H30L38,8V52L30,60H10L2,52V8Z" transform="translate(474,208) scale(0.95)"/>
      <path d="M4,60V0H28L36,8V24L28,32H4" transform="translate(522,208) scale(0.95)"/>
      <path d="M36,8L30,0H10L2,8V22L10,30H30L38,38V52L30,60H10L2,52" transform="translate(570,208) scale(0.95)"/>
    </g>
    <g class="b" filter="url(#blueGlow)" fill="none" stroke="#38bdf8" stroke-width="4.5">
      <path d="M0,60H40" transform="translate(618,208) scale(0.95)"/>
    </g>

    <line x1="180" y1="282" x2="820" y2="282" stroke="#1e293b" stroke-width="1"/>
    <text class="m" x="500" y="298" font-size="11.5" text-anchor="middle" fill="#94a3b8" letter-spacing="3">SOC OPERATIONS  •  INCIDENT RESPONSE  •  DETECTION ENGINEERING</text>
  </g>

  <rect x="12" y="12" width="976" height="296" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 12 42 L 12 28 Q 12 12 28 12 L 42 12" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 988 42 L 988 28 Q 988 12 972 12 L 958 12" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 12 278 L 12 292 Q 12 308 28 308 L 42 308" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 988 278 L 988 292 Q 988 308 972 308 L 958 308" fill="none" stroke="#38bdf8" stroke-width="2"/>
</svg>
