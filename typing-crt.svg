<svg xmlns="http://www.w3.org/2000/svg" width="620" height="90" viewBox="0 0 620 90">
  <defs>
    <style>
      .t { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-size: 16px; font-weight: 700; fill: #00bfff; }
      .c { transform-box: view-box; }
      .c1 { transform-origin: 220px 0; animation: k1 16s infinite backwards; }
      .c2 { transform-origin: 195px 0; animation: k2 16s infinite backwards; animation-delay: 4s; }
      .c3 { transform-origin: 115px 0; animation: k3 16s infinite backwards; animation-delay: 8s; }
      .c4 { transform-origin: 155px 0; animation: k4 16s infinite backwards; animation-delay: 12s; }
      @keyframes k1 { 0% { transform: scaleX(0); animation-timing-function: steps(18); } 10% { transform: scaleX(1); animation-timing-function: step-end; } 23% { transform: scaleX(1); } 24%,100% { transform: scaleX(0); } }
      @keyframes k2 { 0% { transform: scaleX(0); animation-timing-function: steps(23); } 10% { transform: scaleX(1); animation-timing-function: step-end; } 23% { transform: scaleX(1); } 24%,100% { transform: scaleX(0); } }
      @keyframes k3 { 0% { transform: scaleX(0); animation-timing-function: steps(39); } 10% { transform: scaleX(1); animation-timing-function: step-end; } 23% { transform: scaleX(1); } 24%,100% { transform: scaleX(0); } }
      @keyframes k4 { 0% { transform: scaleX(0); animation-timing-function: steps(31); } 10% { transform: scaleX(1); animation-timing-function: step-end; } 23% { transform: scaleX(1); } 24%,100% { transform: scaleX(0); } }
      @keyframes flicker { 0%,100% { opacity: 1; } 47% { opacity: 0.96; } 48% { opacity: 0.84; } 50% { opacity: 1; } 78% { opacity: 0.93; } }
      @keyframes roll { 0% { transform: translateY(-30px); } 100% { transform: translateY(110px); } }
      .fl { animation: flicker 3s infinite; }
      .roll { animation: roll 5s linear infinite; }
    </style>

    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.35"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>

    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00bfff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="screen"><rect x="2" y="2" width="616" height="86" rx="12"/></clipPath>
    <clipPath id="p1"><rect x="220" y="30" width="190" height="30"/></clipPath>
    <clipPath id="p2"><rect x="195" y="30" width="240" height="30"/></clipPath>
    <clipPath id="p3"><rect x="115" y="30" width="400" height="30"/></clipPath>
    <clipPath id="p4"><rect x="155" y="30" width="320" height="30"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect x="2" y="2" width="616" height="86" fill="#020b14"/>

    <g class="fl">
      <g filter="url(#glow)">
        <g clip-path="url(#p1)"><g class="c c1"><text class="t" x="220" y="52" textLength="180" lengthAdjust="spacing">&gt; SYNCING GHOST...</text></g></g>
        <g clip-path="url(#p2)"><g class="c c2"><text class="t" x="195" y="52" textLength="230" lengthAdjust="spacing">&gt; MONITORING THE NET...</text></g></g>
        <g clip-path="url(#p3)"><g class="c c3"><text class="t" x="115" y="52" textLength="390" lengthAdjust="spacing">&gt; THREAT DETECTED — INITIATING RESPONSE</text></g></g>
        <g clip-path="url(#p4)"><g class="c c4"><text class="t" x="155" y="52" textLength="310" lengthAdjust="spacing">&gt; NO ONE SEES THE WHOLE NETWORK</text></g></g>
      </g>
    </g>

    <rect class="roll" x="2" y="0" width="616" height="30" fill="url(#band)"/>
    <rect x="2" y="2" width="616" height="86" fill="url(#scan)"/>
    <rect x="2" y="2" width="616" height="86" fill="url(#vig)"/>
  </g>

  <rect x="2" y="2" width="616" height="86" rx="12" fill="none" stroke="#0b3a5c" stroke-width="1.5"/>
</svg>
